{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block title %}{{ title }} - VIT Campus CA Portal{% endblock %}

{% block content %}
<section class="card error-page">
  {{ icon('alert') }}
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <p class="actions actions-center">
    <a class="button" href="{{ url_for('user.home') }}">{{ icon('arrow-right') }} Go to the home page</a>
  </p>
</section>
{% endblock %}
